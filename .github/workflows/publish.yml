name: Publish to PyPI

# Publishes on release tags (r1.4.5, r1.5.0, ...) matching the existing
# tagging scheme. Authentication uses PyPI trusted publishing via OIDC,
# so no API token is stored in this repository.

on:
  push:
    tags:
      - 'r*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build source distribution and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name configured for the trusted publisher
    # on PyPI. Lets you require a manual approval before a release goes out.
    environment: pypi
    permissions:
      # Required for trusted publishing. Without it the OIDC token is not
      # issued and the upload step fails.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
